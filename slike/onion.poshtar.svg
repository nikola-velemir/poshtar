<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Dark Mode Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Arrow Marker - Inward Call -->
    <marker id="arrowIn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>

    <!-- Arrow Marker - Outward Response -->
    <marker id="arrowOut" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F43F5E" />
    </marker>

    <!-- Arrow Marker - Core Turnaround -->
    <marker id="arrowCore" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399" />
    </marker>

    <!-- Drop Shadows for Layers -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->



  <!-- ONION LAYERS (Nested Concentric Circles) -->
  <g transform="translate(400, 350)" filter="url(#shadow)">
    
    <!-- Outer Layer: Logging Behavior -->
    <circle r="240" fill="#1E293B" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.6" />
    <circle r="240" fill="none" stroke="#3B82F6" stroke-width="2" />
    
    <!-- Middle Layer: Validation Behavior -->
    <circle r="170" fill="#0F172A" stroke="#8B5CF6" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.7" />
    <circle r="170" fill="none" stroke="#8B5CF6" stroke-width="2" />

    <!-- Inner Layer: Transaction/Retry Behavior -->
    <circle r="100" fill="#1E1B4B" stroke="#EC4899" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.8" />
    <circle r="100" fill="none" stroke="#EC4899" stroke-width="2" />

    <!-- Core: Final Handler -->
    <circle r="42" fill="#10B981" stroke="#34D399" stroke-width="3" />

    <!-- LAYER LABELS (Top Center of Each Ring) -->
    <text x="0" y="-218" text-anchor="middle" fill="#60A5FA" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">LOGGING BEHAVIOR</text>
    <text x="0" y="-148" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">VALIDATION BEHAVIOR</text>
    <text x="0" y="-78" text-anchor="middle" fill="#F472B6" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TRANSACTION BEHAVIOR</text>
    
    <!-- Core Label -->
    <text x="0" y="-3" text-anchor="middle" fill="#064E3B" font-family="sans-serif" font-size="12" font-weight="800">FINAL</text>
    <text x="0" y="11" text-anchor="middle" fill="#064E3B" font-family="sans-serif" font-size="12" font-weight="800">HANDLER</text>

    <!-- INWARD CALL ARROWS (Left Side) -->
    <!-- Request Enter -> Logging -->
    <path d="M -280,0 L -248,0" fill="none" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowIn)" />
    
    <!-- Logging -> Validation -->
    <path d="M -232,0 L -178,0" fill="none" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowIn)" />
    
    <!-- Validation -> Transaction -->
    <path d="M -162,0 L -108,0" fill="none" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowIn)" />
    
    <!-- Transaction -> Handler Core -->
    <path d="M -92,0 L -50,0" fill="none" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowIn)" />

    <!-- CORE EXECUTION (U-Turn / Processing Loop) -->

    <!-- OUTWARD RESPONSE ARROWS (Right Side) -->
    <!-- Handler Core -> Transaction -->
    <path d="M 50,0 L 92,0" fill="none" stroke="#F43F5E" stroke-width="3" marker-end="url(#arrowOut)" />
    
    <!-- Transaction -> Validation -->
    <path d="M 108,0 L 162,0" fill="none" stroke="#F43F5E" stroke-width="3" marker-end="url(#arrowOut)" />
    
    <!-- Validation -> Logging -->
    <path d="M 178,0 L 232,0" fill="none" stroke="#F43F5E" stroke-width="3" marker-end="url(#arrowOut)" />
    
    <!-- Logging -> Exit Response -->
    <path d="M 248,0 L 280,0" fill="none" stroke="#F43F5E" stroke-width="3" marker-end="url(#arrowOut)" />

    <!-- ANNOTATION TEXTS (Bottom Arc / Quadrants) -->
    <!-- Pre-Processing Note -->
    <text x="-140" y="150" fill="#7DD3FC" font-family="sans-serif" font-size="11" font-style="italic">
      1. Pre-processing (Inward)
    </text>
   

    <!-- Post-Processing Note -->
    <text x="140" y="150" fill="#FDA4AF" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="end">
      2. Post-processing (Outward)
    </text>
   

  </g>

  <!-- LEGEND (Top Right) -->
  <g transform="translate(570, 25)">
    <rect x="0" y="0" width="205" height="85" fill="#1E293B" stroke="#334155" rx="6" />
    <text x="12" y="20" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="700">LEGEND</text>
    
    <!-- Inward Arrow Legend -->
    <line x1="15" y1="38" x2="45" y2="38" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arrowIn)" />
    <text x="55" y="42" fill="#CBD5E1" font-family="sans-serif" font-size="11">Request (Inward Call)</text>
    
    <!-- Outward Arrow Legend -->
    <line x1="15" y1="62" x2="45" y2="62" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#arrowOut)" />
    <text x="55" y="66" fill="#CBD5E1" font-family="sans-serif" font-size="11">Response (Outward Return)</text>
  </g>

</svg>
