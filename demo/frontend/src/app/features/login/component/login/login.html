<div
  class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden font-mono"
  [ngClass]="{
    'bg-zinc-950': theme === 'spring',
    'bg-slate-950': theme === 'guice'
  }"
>
  <!-- Grid background -->
  <div
    class="absolute inset-0 pointer-events-none"
    [style.backgroundImage]="theme === 'spring'
      ? 'linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px)'
      : 'linear-gradient(rgba(66,133,244,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(66,133,244,0.04) 1px, transparent 1px)'"
    style="background-size: 48px 48px;"
  ></div>

  <!-- Accent blobs -->
  <div
    class="absolute -top-20 -right-20 w-72 h-72 rounded-full pointer-events-none"
    [style.background]="theme === 'spring'
      ? 'radial-gradient(circle, rgba(134,239,172,0.12) 0%, transparent 70%)'
      : 'radial-gradient(circle, rgba(66,133,244,0.12) 0%, transparent 70%)'"
  ></div>
  <div
    class="absolute -bottom-15 -left-15 w-64 h-64 rounded-full pointer-events-none"
    [style.background]="theme === 'spring'
      ? 'radial-gradient(circle, rgba(74,222,128,0.08) 0%, transparent 70%)'
      : 'radial-gradient(circle, rgba(52,168,83,0.08) 0%, transparent 70%)'"
  ></div>

  <!-- Card -->
  <div class="relative w-full max-w-md">

    <!-- Top rule -->
    <div class="flex items-center gap-3 mb-8">
      <div
        class="h-px flex-1"
        [ngClass]="theme === 'spring' ? 'bg-green-400' : 'bg-blue-500'"
      ></div>
      <span
        class="text-xs tracking-[0.3em] uppercase"
        [ngClass]="theme === 'spring' ? 'text-green-400' : 'text-blue-400'"
      >
        {{ theme === 'spring' ? '⚙ Spring Boot' : '💉 Guice' }}
      </span>
      <div
        class="h-px flex-1"
        [ngClass]="theme === 'spring' ? 'bg-green-400' : 'bg-blue-500'"
      ></div>
    </div>

    <!-- Header -->
    <div class="mb-10">
      <div class="text-zinc-500 text-xs tracking-widest uppercase mb-2">
        Welcome back
      </div>
      <h1 class="text-white text-4xl font-bold tracking-tight leading-none">
        Sign In
        <span [ngClass]="theme === 'spring' ? 'text-green-400' : 'text-blue-400'">.</span>
      </h1>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" novalidate class="space-y-5">

      <!-- Username -->
      <div class="group">
        <label
          for="username"
          class="block text-zinc-400 text-xs tracking-widest uppercase mb-2 transition-colors"
          [ngClass]="{
            'group-focus-within:text-green-400': theme === 'spring',
            'group-focus-within:text-blue-400': theme === 'guice'
          }"
        >Username</label>
        <div class="relative">
          <input
            id="username"
            type="text"
            formControlName="username"
            autocomplete="text"
            placeholder="example"
            class="w-full bg-zinc-900 border text-white text-sm px-4 py-3 outline-none placeholder-zinc-600 transition-all duration-200 hover:border-zinc-500"
            [ngClass]="{
              'border-zinc-700 focus:border-green-400 focus:ring-1 focus:ring-green-400': theme === 'spring',
              'border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500': theme === 'guice',
              'border-red-500': loginForm.get('username')?.invalid && loginForm.get('username')?.touched
            }"
          />
          <span
            *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-red-400 text-xs"
          >✕</span>
        </div>
        <p *ngIf="loginForm.get('username')?.errors?.['required'] && loginForm.get('username')?.touched"
           class="mt-1.5 text-red-400 text-xs tracking-wide">
          Username is required.
        </p>
      </div>

      <!-- Password -->
      <div class="group">
        <label
          for="password"
          class="block text-zinc-400 text-xs tracking-widest uppercase mb-2 transition-colors"
          [ngClass]="{
            'group-focus-within:text-green-400': theme === 'spring',
            'group-focus-within:text-blue-400': theme === 'guice'
          }"
        >Password</label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full bg-zinc-900 border text-white text-sm px-4 py-3 pr-16 outline-none placeholder-zinc-600 transition-all duration-200 hover:border-zinc-500"
            [ngClass]="{
              'border-zinc-700 focus:border-green-400 focus:ring-1 focus:ring-green-400': theme === 'spring',
              'border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500': theme === 'guice',
              'border-red-500': loginForm.get('password')?.invalid && loginForm.get('password')?.touched
            }"
          />
          <button
            type="button"
            (click)="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 transition-colors text-xs select-none text-zinc-500"
            [ngClass]="theme === 'spring' ? 'hover:text-green-400' : 'hover:text-blue-400'"
          >
            {{ showPassword() ? 'HIDE' : 'SHOW' }}
          </button>
        </div>
        <p *ngIf="loginForm.get('password')?.errors?.['required'] && loginForm.get('password')?.touched"
           class="mt-1.5 text-red-400 text-xs tracking-wide">
          Password is required.
        </p>
        <p *ngIf="loginForm.get('password')?.errors?.['minlength'] && loginForm.get('password')?.touched"
           class="mt-1.5 text-red-400 text-xs tracking-wide">
          Minimum 8 characters required.
        </p>
      </div>

      <!-- Server error -->
      <div
        *ngIf="errorMessage()"
        class="border border-red-800 bg-red-950 px-4 py-3 text-red-400 text-xs tracking-wide flex items-start gap-2"
      >
        <span class="mt-px">⚠</span>
        <span>{{ errorMessage() }}</span>
      </div>

      <!-- Register link -->
      <div class="flex justify-between">
        <span class="text-white text-xs">Don't have an account?</span>
        <span
          class="text-xs cursor-pointer"
          [ngClass]="theme === 'spring' ? 'text-green-400' : 'text-blue-400'"
          (click)="navigateToRegister()"
        >Register here</span>
      </div>

      <!-- Submit button -->
      <div class="pt-2">
        <button
          type="submit"
          [disabled]="isLoading() || loginForm.invalid"
          class="w-full font-bold text-sm tracking-widest uppercase py-3.5 px-6 transition-all duration-200 outline-none active:scale-[0.99] disabled:opacity-40 disabled:cursor-not-allowed focus-visible:ring-2 focus-visible:ring-offset-2"
          [ngClass]="{
            'bg-green-400 text-zinc-900 hover:bg-green-300 disabled:hover:bg-green-400 focus-visible:ring-green-400 focus-visible:ring-offset-zinc-950': theme === 'spring',
            'bg-blue-500 text-white hover:bg-blue-400 disabled:hover:bg-blue-500 focus-visible:ring-blue-500 focus-visible:ring-offset-slate-950': theme === 'guice'
          }"
        >
          <span *ngIf="!isLoading()">Sign In →</span>
          <span *ngIf="isLoading()" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            Authenticating...
          </span>
        </button>
      </div>

    </form>
  </div>
</div>
