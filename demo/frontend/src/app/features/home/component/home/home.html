<div class="min-h-screen bg-zinc-950 flex font-mono text-white">

    <!-- Sidebar -->
    <aside class="hidden lg:flex flex-col w-56 border-r border-zinc-800 px-5 py-8 shrink-0">
        <!-- Logo -->
        <div class="mb-10">
            <span class="text-yellow-400 text-xl font-bold tracking-tight">WORK<span
                    class="text-white">SPACE</span></span>
            <div class="h-px bg-yellow-400 mt-2 w-8"></div>
        </div>



        <!-- User -->
        <div class="border-t border-zinc-800 pt-4 mt-4">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-yellow-400 flex items-center justify-center text-zinc-900 text-xs font-bold">
                </div>
                <div>
                    <div class="text-white text-xs font-bold">{{userData?. username }}</div>
                    <div class="text-zinc-600 text-[10px] tracking-wide">Pro Plan</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main content -->
    <div class="flex-1 flex flex-col min-w-0">

        <!-- Top bar -->
        <header class="border-b border-zinc-800 px-6 lg:px-8 py-4 flex items-center justify-between shrink-0">
            <div>
                <div class="text-zinc-600 text-xs tracking-widest uppercase">{{ todayDate }}</div>
                <h1 class="text-white text-xl font-bold tracking-tight mt-0.5">
                    Good {{ greeting }}, <span class="text-yellow-400">{{ userData?.firsName }}</span>.
                </h1>
            </div>
            <!-- Notification dot -->
            <button
                class="relative w-8 h-8 border border-zinc-800 flex items-center justify-center text-zinc-500 hover:text-white hover:border-zinc-600 transition-all">
                <span class="text-sm">🔔</span>
                <span class="absolute top-1 right-1 w-1.5 h-1.5 bg-yellow-400 rounded-full"></span>
            </button>
        </header>

        <!-- Body -->
        <main class="flex-1 overflow-y-auto px-6 lg:px-8 py-8">

            <!-- Stats row -->
            <!-- <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div *ngFor="let stat of stats"
                    class="border border-zinc-800 bg-zinc-900 px-5 py-4 relative overflow-hidden">
                    <div class="text-zinc-600 text-[10px] tracking-widest uppercase mb-1">{{ stat.label }}</div>
                    <div class="text-2xl font-bold" [class]="stat.color">{{ stat.value }}</div>
                    <div class="text-zinc-600 text-[10px] mt-1">{{ stat.sub }}</div>
                    <div class="absolute bottom-0 right-0 w-8 h-8 border-l border-t border-zinc-700 opacity-40"></div>
                </div>
            </div> -->

        </main>
    </div>
</div>
